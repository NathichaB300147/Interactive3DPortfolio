<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

// --- Scene ---
const scene = new THREE.Scene();

// --- Camera + Controls ---
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(5.720544185259418, 1.7483847722228807, 19.50606803464567);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = true;
controls.enablePan = true;
controls.minDistance = 0.2;
controls.maxDistance = 100;

// --- HDRI Environment ---
const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();
new EXRLoader()
  .setDataType(THREE.FloatType)
  .load('https://nathichab300147.github.io/Interactive3DPortfolio/kloppenheim_06_puresky_1k.exr', tex => {
    const envMap = pmremGenerator.fromEquirectangular(tex).texture;
    scene.environment = envMap;
    tex.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = tex;
  }, undefined, err => console.error(err));

// --- Lighting ---
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
dirLight.position.set(70, 100, 70);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.far = 200;
scene.add(dirLight);

// --- GLTF Loader ---
const gltfLoader = new GLTFLoader();
function loadGLB(url) {
  return new Promise((resolve, reject) => {
    gltfLoader.load(url, gltf => resolve(gltf.scene), undefined, reject);
  });
}

// --- Cell shader (for TheLittlePrince) ---
const cellUniforms = {
  uTime: { value: 0.0 },
  uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() },
  uTex: { value: null }
};

const cellVert = `
uniform float uTime;
varying vec3 vNormal;
varying vec3 vPosW;
varying vec2 vUv;

void main(){
  vNormal = normalize(mat3(modelMatrix) * normal);
  vec3 pos = position;
  vUv = uv;
  vPosW   = ( modelMatrix * vec4(pos, 1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
}
`;

const cellFrag = `
precision mediump float;
varying vec3 vNormal;
uniform vec3 uLightDir;
varying vec3 vPosW;
varying vec2 vUv;
uniform sampler2D uTex;

void main()
{
  float diffuse = clamp(dot(vNormal, uLightDir), 0.0, 1.0);
  float levels = 3.0;
  diffuse  = floor(diffuse * levels) / levels;
  diffuse  += 0.3;

  vec3 R = reflect(-uLightDir, vNormal);
  vec3 V = normalize(cameraPosition - vPosW);
  float specular = max( pow( dot(R,V), 8.0 ) , 0.0);
  specular = smoothstep(0.4, 0.6, specular);
  specular = clamp(specular, 0.0, 0.5);
  if(diffuse <= 0.5) specular = 0.0;

  vec3 base = texture2D(uTex, vUv).rgb;
  vec3 color = (base  * diffuse) + vec3(specular);
  gl_FragColor = vec4(color, 1.0);
}
`;

// Collect created cell materials so we can update uniforms.uTime each frame
const _cellMaterials = [];

// --- Raycaster & interaction state ---
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const interactables = [];

function addClickable(mesh, name) {
  mesh.name = name;
  interactables.push(mesh);
  return mesh;
}

function setPointer(e) {
  const r = renderer.domElement.getBoundingClientRect();
  const x = (e.clientX ?? e.touches[0].clientX) - r.left;
  const y = (e.clientY ?? e.touches[0].clientY) - r.top;
  pointer.x = (x / r.width) * 2 - 1;
  pointer.y = -(y / r.height) * 2 + 1;
}

// --- Camera move/tween ---
const cameraMove = {
  active: false,
  fromPos: new THREE.Vector3(),
  toPos: new THREE.Vector3(),
  fromTarget: new THREE.Vector3(),
  toTarget: new THREE.Vector3(),
  startTime: 0,
  duration: 1.0
};

function startCameraMove(toPos, toTarget, durationSec = 1.0) {
  cameraMove.active = true;
  cameraMove.fromPos.copy(camera.position);
  cameraMove.toPos.copy(toPos);
  cameraMove.fromTarget.copy(controls.target);
  cameraMove.toTarget.copy(toTarget);
  cameraMove.startTime = performance.now();
  cameraMove.duration = durationSec;
}

// --- Pick handler ---
function onPick(e) {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(interactables, true);
  if (hits.length === 0) return;

  let obj = hits[0].object;
  while (obj && !interactables.includes(obj)) { obj = obj.parent; }
  if (!obj) return;

  const view = VIEWS[obj.name];
  if (!view) return;

  if (view.fit) {
    let root = obj;
    while (root.parent && root.parent.type !== 'Scene') root = root.parent;
    const bbox = new THREE.Box3().setFromObject(root);
    const sphere = bbox.getBoundingSphere(new THREE.Sphere());
    const center = sphere.center;
    const radius = sphere.radius;
    const camDir = camera.position.clone().sub(center).normalize();
    const fitFactor = view.fitFactor ?? 2.0;
    const fitPos = center.clone().add(camDir.multiplyScalar(radius * fitFactor));
    startCameraMove(fitPos, center.clone(), view.duration ?? 1.0);
    return;
  }

  startCameraMove(view.pos.clone(), view.tar.clone(), view.duration ?? 1.0);
}

renderer.domElement.addEventListener('click', onPick);
renderer.domElement.addEventListener('touchend', e => onPick(e), { passive: true });

    'tree_4.glb','tree_5.glb','tree_6.glb','tree_7.glb','tree_8.glb','tree_9.glb',

    'tag_1.glb','tag_2.glb','tag_3.glb','midtag.glb','TheLittlePrince.glb',
    '1toleft.glb','2toback.glb','3toright.glb','card.glb', 'welcome.glb', 'credit.glb',

  ];

    for (const url of modelURLs) {
    const model = await loadGLB(`https://nathichab300147.github.io/Interactive3DPortfolio/${url}`);
    model.traverse(child => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    scene.add(model);

    if (url === 'tag_1.glb') tag1 = model;
    if (url === 'tag_2.glb') tag2 = model;
    if (url === 'tag_3.glb') tag3 = model;
    if (url === 'welcome.glb') welcome = model;
    if (url === 'credit.glb') credit = model;
    // if (url === 'tagblue2_1.glb') tagblue2_1 = model;
    // if (url === 'tagpink3_1.glb') tagpink3_1 = model;
    if (url === 'back1.glb') back1 = model;
    // if (url === 'tagyell1_2.glb') tagyell1_2 = model;
    // if (url === 'tagpink3_2.glb') tagpink3_2 = model;
    if (url === 'back2.glb') back2 = model;   
    // if (url === 'tagyell1_3.glb') tagyell1_3 = model;
    // if (url === 'tagblue2_3.glb') tagblue2_3 = model;
    if (url === 'back3.glb') back3 = model;
    if (url === 'thxback.glb') thxback = model;

    // If this is TheLittlePrince, replace mesh materials with cell shader
    if(url === 'TheLittlePrince.glb'){
      model.traverse(child =>{
        if(child.isMesh){
          const origMap = child.material && child.material.map ? child.material.map : null;
          const mat = new THREE.ShaderMaterial({
            vertexShader: cellVert,
            fragmentShader: cellFrag,
            uniforms: {
              uTime: cellUniforms.uTime,
              uLightDir: cellUniforms.uLightDir,
              uTex: { value: origMap }
            }
          });
          child.material = mat;
          _cellMaterials.push(mat);
        }
      });
    }

    model.traverse(child => {
      if (child.isMesh) {
        if (url === 'tag_1.glb') addClickable(child, 'tag_1');
        if (url === 'tag_2.glb') addClickable(child, 'tag_2');
        if (url === 'tag_3.glb') addClickable(child, 'tag_3');
        if (url === 'welcome.glb') addClickable(child, 'welcome');
        if (url === 'credit.glb') addClickable(child, 'credit');
        // if (url === 'tagblue2_1.glb') addClickable(child, 'tagblue2_1');
        // if (url === 'tagpink3_1.glb') addClickable(child, 'tagpink3_1');
        if (url === 'back1.glb') addClickable(child, 'back1');
        // if (url === 'tagyell1_2.glb') addClickable(child, 'tagyell1_2');  
        // if (url === 'tagpink3_2.glb') addClickable(child, 'tagpink3_2');
        if (url === 'back2.glb') addClickable(child, 'back2');
        // if (url === 'tagyell1_3.glb') addClickable(child, 'tagyell1_3');
        // if (url === 'tagblue2_3.glb') addClickable(child, 'tagblue2_3');
        if (url === 'back3.glb') addClickable(child, 'back3');
        if (url === 'thxback.glb') addClickable(child, 'thxback');
      }
    });
  }

    VIEWS = {
    tag_1: {
      pos: new THREE.Vector3(-5.361588826016526, 1.0637464661245415, 3.6267905207799407),
      tar: new THREE.Vector3(-5.361588826016526, 1.0637464661245415, 3.6267905207799407)
    },
    tag_2: {

      tar: new THREE.Vector3(1.092625418660799, 1.1591615448210828, 1.2790626908436926)
    },
    tag_3: {

      tar: new THREE.Vector3(3.5601368149475765, 1.286221500973665, 3.270209851142623)
    },
    welcome: {

    },
    credit: {

      tar: new THREE.Vector3(-2.1113760582789558e-7, -17.492722847151967, -0.00001749144858722032)
    },   
    /*tagblue2_1: {

      tar: new THREE.Vector3(1.092625418660799, 1.1591615448210828, 1.2790626908436926)
    },    
    tagpink3_1: {
      pos: new THREE.Vector3(3.5601368149475765, 1.286221500973665, 3.270209851142623),
      tar: new THREE.Vector3(3.5601368149475765, 1.286221500973665, 3.270209851142623)
    },*/
    back1: {
      pos: new THREE.Vector3(-0.16296479283107188, 1.554852177151293, 5.433626330313015),
      tar: new THREE.Vector3(-0.16296479283107188, 1.554852177151293, 5.433626330313015)
    },
    /*tagyell1_2: {
      pos: new THREE.Vector3(-5.361588826016526, 1.0637464661245415, 3.6267905207799407),
      tar: new THREE.Vector3(-5.361588826016526, 1.0637464661245415, 3.6267905207799407)
    },
    tagpink3_2: {
      pos: new THREE.Vector3(3.5601368149475765, 1.286221500973665, 3.270209851142623),
      tar: new THREE.Vector3(3.5601368149475765, 1.286221500973665, 3.270209851142623)
    },*/
    back2: {
      pos: new THREE.Vector3(-0.16296479283107188, 1.554852177151293, 5.433626330313015),
      tar: new THREE.Vector3(-0.16296479283107188, 1.554852177151293, 5.433626330313015)
    },
    /*tagyell1_3: {
      pos: new THREE.Vector3(-5.361588826016526, 1.0637464661245415, 3.6267905207799407),
      tar: new THREE.Vector3(-5.361588826016526, 1.0637464661245415, 3.6267905207799407)
    },
    tagblue2_3: {
      pos: new THREE.Vector3(1.092625418660799, 1.1591615448210828, 1.2790626908436926),
      tar: new THREE.Vector3(1.092625418660799, 1.1591615448210828, 1.2790626908436926)
    },*/  
    back3: {
      pos: new THREE.Vector3(-0.16296479283107188, 1.554852177151293, 5.433626330313015),
      tar: new THREE.Vector3(-0.16296479283107188, 1.554852177151293, 5.433626330313015)
    },
    thxback: {
      pos: new THREE.Vector3(5.720544185259418, 1.7483847722228807, 19.50606803464567),
      tar: new THREE.Vector3(5.720544185259418, 1.7483847722228807, 19.50606803464567)
    }
  };

}

//  const uniforms = {

//     uHeight: { value: null } // texture ที่จะโหลดมา

   //load water plane 
    const uniforms = { 
    uTime: { value: 0.0 } ,
    uHeight: { value: null }, // texture ที่จะโหลดมา
    uDeep: { value: new THREE.Color(0x385D8D) }, // deep blue (for valleys)
    uHigh: { value: new THREE.Color(0xB2E4FF) }, // light blue (for peaks)
    uContrast: { value: 1.0 }
  };
    // pan offset and animation controls
    uniforms.uOffset = { value: new THREE.Vector2(0.0, 0.0) };
    uniforms.uAmplitude = { value: 0.12 }; // vertical wave amplitude
    uniforms.uSpeed = { value: 1.5 }; // speed multiplier for time
    uniforms.uFreq = { value: 12.0 }; // how strongly height modulates phase
    // ---- Shaders (sample texture ใน vertex แล้วดัน pos.z) ----
    const vert = `
        uniform sampler2D uHeight;
        uniform float uTime; //sinc animation

        // pan offset for sampling heightmap
        uniform vec2 uOffset;

    // animation controls
    uniform float uAmplitude;
    uniform float uSpeed;
    uniform float uFreq;

        varying float vH;

        void main(){
        vec3 pos = position;
        // float h = texture2D(uHeight, uv).r* sin(uTime)+0.5; 
    float h = texture2D(uHeight, uv + uOffset).r;
    // base displacement from heightmap
    pos.z = pos.z + (h * 0.8);
    // add time-based vertical animation modulated by height
    float wave = sin(uTime * uSpeed + h * uFreq) * uAmplitude;
    pos.z += wave;
        vH = h;                             
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    `;
    const frag = `
        precision mediump float;
        uniform vec3 uDeep;
        uniform vec3 uHigh;
        uniform float uContrast;
        uniform vec2 uOffset;
        varying float vH;
        void main(){
        // map vH [0,1] to [0,1] with simple contrast control
        float t = clamp(vH, 0.0, 1.0);
        // simple contrast: remap around 0.5
        t = (t - 0.5) * uContrast + 0.5;
        t = clamp(t, 0.0, 1.0);
        vec3 color = mix(uDeep, uHigh, t);
        gl_FragColor = vec4(color, 1.0);
        }
    `;

    // โหลด texture แล้วค่อยสร้าง geometry/material ให้สัดส่วนตรงกับรูป
    new THREE.TextureLoader().load('https://upload.wikimedia.org/wikipedia/commons/5/57/Heightmap.png', (tex) => {

        uniforms.uHeight.value = tex;
        const geo = new THREE.PlaneBufferGeometry(70, 70, 200, 200);
        const mat = new THREE.ShaderMaterial({
        vertexShader: vert,
        fragmentShader: frag,
        uniforms: uniforms,
        //wireframe: true, // เปิดถ้าอยากดูเส้นตาราง
        side: THREE.DoubleSide
        
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2; // หมุน plane แนวราบ
        mesh.position.y = -1; // ลดระดับลงนิดหน่อย
        scene.add(mesh);
    });

  // Resize & Render loop
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function loop(){
    uniforms.uTime.value += 0.05;
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();

init();

// --- Animation loop ---
function animate() {
  requestAnimationFrame(animate);

  if (cameraMove.active) {
    const now = performance.now();
    let t = Math.min(1, (now - cameraMove.startTime) / (cameraMove.duration * 1000));
    t = t * t * (3 - 2 * t); // smoothstep

    camera.position.lerpVectors(cameraMove.fromPos, cameraMove.toPos, t);
    controls.target.lerpVectors(cameraMove.fromTarget, cameraMove.toTarget, t);

    if (t === 1) cameraMove.active = false;
  }
  // update shader time uniform for cell materials
  const nowSec = performance.now() / 1000;
  for(const m of _cellMaterials){
    if(m.uniforms && m.uniforms.uTime) m.uniforms.uTime.value = nowSec;
    if(m.uniforms && m.uniforms.uLightDir) m.uniforms.uLightDir.value.set(Math.sin(nowSec)*0.2, 1.0, 0.8);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Debug Camera Position ---
window.addEventListener('keydown', (event) => {
  if (event.key === 'c' || event.key === 'C') {
    console.log("Camera position:", camera.position);
    console.log("Controls target:", controls.target);
  }
});
